
# ==============================
# APPLICATION
# ==============================
spring.application.name=SevakramOnlineExamSystem
# ==============================
# MYSQL DATABASE
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sevakram_online_exam_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# ==============================
# JPA/Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ==============================
# DEFAULT ADMIN ACCOUNT
# ==============================

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}



# ==============================
# GMAIL SMTP - Admin login 2FA
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender email used by EmailService.java
app.mail.from=${spring.mail.username}

# Optional CC - leave empty if not needed
app.mail.cc=

# ==============================
# RESEND SMTP - Student OTP
# ==============================
resend.smtp.host=smtp.resend.com
resend.smtp.port=465
resend.smtp.username=resend
resend.smtp.password=${RESEND_API_KEY:}

# Sender email used by EmailService.java
resend.smtp.from=${spring.mail.username}








