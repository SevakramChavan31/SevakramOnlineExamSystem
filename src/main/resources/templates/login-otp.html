<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Verification | Online Examination System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            font-family: Arial, sans-serif;
        }

        .otp-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .18);
        }

        .otp-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e7f1ff;
            color: #0d6efd;
            font-size: 28px;
        }

        @media (max-width: 480px) {
            .otp-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="otp-card">

    <div class="text-center">
        <div class="otp-icon">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h3 class="fw-bold mb-2">Admin Verification</h3>

        <p class="text-muted mb-4">
            Enter the 6-digit verification code sent to your registered email address.
        </p>
    </div>

    <div th:if="${success != null}"
         class="alert alert-success"
         role="alert"
         th:text="${success}">
    </div>

    <div th:if="${error != null}"
         class="alert alert-danger"
         role="alert"
         th:text="${error}">
    </div>

    <!-- VERIFY OTP -->
    <form method="post"
          th:action="@{/login/verify-otp}"
          autocomplete="off">

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>

            <input type="email"
                   class="form-control"
                   th:value="${email}"
                   disabled>
        </div>

        <div class="mb-3">
            <label for="otp" class="form-label fw-semibold">
                Verification Code
            </label>

            <input type="text"
                   class="form-control form-control-lg text-center"
                   id="otp"
                   name="otp"
                   inputmode="numeric"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   autocomplete="one-time-code"
                   placeholder="Enter 6-digit OTP"
                   required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-shield-check me-1"></i>
            Verify &amp; Continue
        </button>
    </form>

    <!-- RESEND OTP -->
    <form method="post"
          th:action="@{/login/resend-otp}"
          class="mt-2">

        <button type="submit" class="btn btn-outline-secondary w-100">
            <i class="bi bi-arrow-repeat me-1"></i>
            Resend OTP
        </button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login(role='admin')}"
           class="text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Admin Login
        </a>
    </div>

</div>

</body>
</html>
