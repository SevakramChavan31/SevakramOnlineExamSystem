<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${exam.title + ' Exam | Online Examination System'}">Online Examination System</title>

  <!-- =========================
     DATABASE QUESTION DATA
========================= -->

  <div id="questionData" style="display:none;">

    <div th:each="question : ${questions}"
         class="db-question"
         th:attr="data-id=${question.id},
                  data-text=${question.questionText},
                  data-marks=${question.marks}">

      <div th:each="option : ${questionOptions[question.id]}"
           class="db-option"
           th:attr="data-id=${option.id},
                      data-label=${option.optionLabel},
                      data-text=${option.optionText}">
      </div>

    </div>

  </div>


  <!-- Bootstrap -->
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel= "stylesheet">

  <!-- Bootstrap Icons -->
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f8fafc;
      --text: #172033;
      --secondary: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       NAVBAR
    ========================= */

    .exam-navbar {
      height: 70px;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 19px;
      font-weight: 700;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(
              135deg,
              var(--primary),
              #1e40af
      );
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand span {
      color: var(--primary);
    }

    .exam-title-nav {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
    }

    /* =========================
       TIMER
    ========================= */

    .timer-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eff6ff;
      color: var(--primary);
      padding: 9px 15px;
      border-radius: 10px;
      font-weight: 700;
    }

    .timer-container i {
      font-size: 18px;
    }

    .timer {
      font-size: 17px;
      letter-spacing: 1px;
    }

    .timer.warning {
      background: #fff7ed;
      color: #ea580c;
    }

    .timer.danger {
      background: #fef2f2;
      color: var(--danger);
      animation: blink 1s infinite;
    }

    @keyframes blink {

      50% {
        opacity: .55;
      }

    }

    /* =========================
       MAIN LAYOUT
    ========================= */

    .exam-wrapper {
      max-width: 1400px;
      margin: auto;
      padding: 25px;
    }

    .exam-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 22px;
    }

    /* =========================
       QUESTION CARD
    ========================= */

    .question-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
    }

    .question-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .question-number {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .question-count {
      color: var(--secondary);
      font-size: 13px;
    }

    .question-body {
      padding: 30px;
    }

    .question-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* =========================
       OPTIONS
    ========================= */

    .option {
      position: relative;
      margin-bottom: 12px;
    }

    .option input {
      position: absolute;
      opacity: 0;
    }

    .option label {
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 15px 17px;
      cursor: pointer;
      transition: .2s;
      color: #475569;
      font-size: 14px;
    }

    .option label:hover {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .option-letter {
      min-width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    .option input:checked + label {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--text);
    }

    .option input:checked + label .option-letter {
      background: var(--primary);
      color: white;
    }

    /* =========================
       QUESTION ACTIONS
    ========================= */

    .question-actions {
      border-top: 1px solid var(--border);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-previous,
    .btn-next,
    .btn-review {
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-previous {
      background: white;
      border: 1px solid var(--border);
      color: #475569;
    }

    .btn-previous:hover {
      background: #f8fafc;
    }

    .btn-next {
      background: var(--primary);
      color: white;
      border: none;
    }

    .btn-next:hover {
      background: var(--primary-dark);
      color: white;
    }

    .btn-review {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #c2410c;
    }

    .btn-review:hover {
      background: #ffedd5;
    }

    /* =========================
       RIGHT PANEL
    ========================= */

    .side-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .side-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 17px;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress {
      height: 8px;
      background: #e2e8f0;
      border-radius: 20px;
    }

    .progress-bar {
      background: var(--primary);
      border-radius: 20px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--secondary);
    }

    /* =========================
       QUESTION PALETTE
    ========================= */

    .question-palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .palette-btn {
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .palette-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .palette-btn.current {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .palette-btn.answered {
      background: #dcfce7;
      border-color: #bbf7d0;
      color: #15803d;
    }

    .palette-btn.review {
      background: #fef3c7;
      border-color: #fde68a;
      color: #b45309;
    }

    .palette-btn.current.answered {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* =========================
       LEGEND
    ========================= */

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--secondary);
      margin-bottom: 9px;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .legend-current {
      background: var(--primary);
      border-color: var(--primary);
    }

    .legend-answered {
      background: #dcfce7;
      border-color: #bbf7d0;
    }

    .legend-review {
      background: #fef3c7;
      border-color: #fde68a;
    }

    .legend-not {
      background: white;
    }

    /* =========================
       SUBMIT
    ========================= */

    .submit-btn {
      width: 100%;
      border: none;
      background: var(--danger);
      color: white;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .submit-btn:hover {
      background: #b91c1c;
    }

    .security-text {
      text-align: center;
      color: var(--secondary);
      font-size: 11px;
      margin-top: 12px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 991px) {

      .exam-layout {
        grid-template-columns: 1fr;
      }

      .question-palette {
        grid-template-columns: repeat(10, 1fr);
      }

    }

    @media (max-width: 767px) {

      .exam-wrapper {
        padding: 15px;
      }

      .exam-title-nav {
        display: none;
      }

      .timer-container {
        padding: 8px 10px;
      }

      .timer {
        font-size: 14px;
      }

      .question-body {
        padding: 20px;
      }

      .question-text {
        font-size: 17px;
      }

      .question-actions {
        flex-wrap: wrap;
      }

      .question-actions .btn-review {
        order: 3;
        width: 100%;
      }

      .question-palette {
        grid-template-columns: repeat(6, 1fr);
      }

    }

  </style>

  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="exam-navbar">

  <div class="container-fluid px-4 h-100
                d-flex align-items-center justify-content-between">

    <!-- BRAND -->

    <a href="/student/dashboard" class="brand">

      <div class="brand-icon">

        <i class="bi bi-mortarboard-fill"></i>

      </div>

      <div>
        Online <span>Exam</span>
      </div>

    </a>


    <!-- EXAM NAME -->

    <div class="exam-title-nav" th:text="${exam.title}">Exam</div>


    <!-- TIMER -->

    <div id="timerContainer" class="timer-container">

      <i class="bi bi-clock-fill"></i>

      <span id="timer" class="timer">00:00</span>

    </div>

  </div>

</nav>


<!-- =========================
     EXAM WRAPPER
========================= -->

<div class="exam-wrapper">


  <div class="exam-layout">


    <!-- =========================
         LEFT QUESTION AREA
    ========================= -->

    <div>


      <div class="question-card">


        <!-- QUESTION HEADER -->

        <div class="question-header">

          <span class="question-number">
            Question <span id="currentQuestion">1</span>
          </span>

          <span class="question-count">
            of <span id="totalQuestionCount"
                     th:text="${#lists.size(questions)}">0</span>
          </span>

        </div>


        <!-- QUESTION BODY -->

        <div class="question-body">

          <div class="question-text" id="questionText">
            Loading question...
          </div>

          <div id="optionContainer"></div>

        </div>


        <!-- QUESTION ACTIONS -->

        <div class="question-actions">

          <button type="button"
                  class="btn-previous"
                  id="previousBtn"
                  disabled>

            <i class="bi bi-arrow-left me-1"></i>
            Previous

          </button>

          <button type="button"
                  class="btn-review"
                  id="reviewBtn">

            <i class="bi bi-flag me-1"></i>
            Mark for Review

          </button>

          <button type="button"
                  class="btn-next"
                  id="nextBtn">

            Next
            <i class="bi bi-arrow-right ms-1"></i>

          </button>

        </div>

      </div>

    </div>


    <!-- =========================
         RIGHT SIDEBAR
    ========================= -->

    <aside>


      <!-- PROGRESS -->

      <div class="side-card">

        <div class="side-title">

          Exam Progress

        </div>


        <div class="progress">

          <div id="progressBar" class="progress-bar" style="width: 0%;"></div>

        </div>


        <div class="progress-text">

          <span id="progressQuestionText">Question 0 of 0</span>

          <span id="progressPercent">0%</span>

        </div>

      </div>


      <!-- QUESTION PALETTE -->

      <div class="side-card">

        <div class="side-title">

          Questions

        </div>


        <div class="question-palette"
             id="questionPalette">

          <!-- Generated by JavaScript -->

        </div>

      </div>


      <!-- LEGEND -->

      <div class="side-card">

        <div class="side-title">

          Question Status

        </div>


        <div class="legend-item">

          <span class="legend-box legend-current"></span>

          Current

        </div>


        <div class="legend-item">

          <span class="legend-box legend-answered"></span>

          Answered

        </div>


        <div class="legend-item">

          <span class="legend-box legend-review"></span>

          Marked for Review

        </div>


        <div class="legend-item">

          <span class="legend-box legend-not"></span>

          Not Answered

        </div>

      </div>


      <!-- SUBMIT -->

      <div class="side-card">

        <button
                type="button"
                class="submit-btn"
                id="submitBtn">

          <i class="bi bi-send-fill me-1"></i>

          Submit Exam

        </button>


        <div class="security-text">

          <i class="bi bi-shield-check"></i>

          Your answers are saved securely.

        </div>

      </div>


    </aside>

  </div>

</div>


<!-- Bootstrap -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script th:inline="javascript">

  /* =========================================
     DATABASE QUESTIONS
  ========================================= */

  const questionData = [];

  document.querySelectorAll("#questionData .db-question").forEach(function (element) {

    const options = [];

    element.querySelectorAll(".db-option").forEach(function (option) {

      options.push({
        id: Number(option.dataset.id),
        label: option.dataset.label,
        text: option.dataset.text
      });

    });

    questionData.push({
      id: Number(element.dataset.id),
      text: element.dataset.text,
      marks: Number(element.dataset.marks),
      options: options
    });

  });


  const totalQuestions = questionData.length;
  let currentQuestion = 0;

  const answers = {};
  const reviewQuestions = new Set();


  /* =========================================
     QUESTION PALETTE
  ========================================= */

  const palette =
          document.getElementById("questionPalette");

  for (let i = 0; i < totalQuestions; i++) {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "palette-btn";
    button.textContent = i + 1;
    button.dataset.question = i;

    button.addEventListener("click", function () {

      saveCurrentAnswer();
      currentQuestion = i;
      loadQuestion();

    });

    palette.appendChild(button);

  }


  /* =========================================
     LOAD QUESTION
  ========================================= */

  function loadQuestion() {

    if (totalQuestions === 0) {

      document.getElementById("questionText").textContent =
              "No active questions are available for this exam.";

      document.getElementById("previousBtn").disabled = true;
      document.getElementById("nextBtn").disabled = true;
      document.getElementById("reviewBtn").disabled = true;

      return;
    }

    const question = questionData[currentQuestion];

    document.getElementById("currentQuestion").textContent =
            currentQuestion + 1;

    document.getElementById("totalQuestionCount").textContent =
            totalQuestions;

    document.getElementById("questionText").textContent =
            question.text;

    const optionContainer =
            document.getElementById("optionContainer");

    optionContainer.innerHTML = "";

    question.options.forEach(function (option, index) {

      const wrapper = document.createElement("div");
      wrapper.className = "option";

      const inputId =
              "option_" + question.id + "_" + option.id;

      const input = document.createElement("input");

      input.type = "radio";
      input.name = "answer";
      input.id = inputId;
      input.value = option.id;

      const label = document.createElement("label");
      label.htmlFor = inputId;

      const letter = document.createElement("span");
      letter.className = "option-letter";
      letter.textContent =
              option.label || String.fromCharCode(65 + index);

      const optionText = document.createElement("span");
      optionText.textContent = option.text;

      label.appendChild(letter);
      label.appendChild(optionText);

      wrapper.appendChild(input);
      wrapper.appendChild(label);

      optionContainer.appendChild(wrapper);

      // Save the selected option immediately.
      input.addEventListener("change", function () {
        answers[question.id] = Number(this.value);
        updatePalette();
        updateProgress();
      });

    });

    if (answers[question.id]) {

      const savedRadio =
              document.querySelector(
                      "input[name='answer'][value='" +
                      answers[question.id] +
                      "']"
              );

      if (savedRadio) {
        savedRadio.checked = true;
      }

    }

    updateButtons();
    updateProgress();
    updatePalette();
    updateReviewButton();

  }


  /* =========================================
     SAVE ANSWER
  ========================================= */

  function saveCurrentAnswer() {

    if (totalQuestions === 0) {
      return;
    }

    const question = questionData[currentQuestion];

    const selected =
            document.querySelector(
                    "input[name='answer']:checked"
            );

    if (selected) {
      answers[question.id] = Number(selected.value);
      updatePalette();
      updateProgress();
    }

  }


  /* =========================================
     NEXT
  ========================================= */

  document.getElementById("nextBtn")
          .addEventListener("click", function () {

            saveCurrentAnswer();

            if (currentQuestion < totalQuestions - 1) {

              currentQuestion++;
              loadQuestion();

            } else {

              // Question 10: Finish and submit after confirmation.
              const answeredCount =
                      Object.keys(answers).length;

              const confirmSubmit =
                      confirm(
                              "You have answered " +
                              answeredCount +
                              " out of " +
                              totalQuestions +
                              " questions.\n\n" +
                              "Are you sure you want to finish the exam?"
                      );

              if (confirmSubmit) {
                submitExam();
              }
            }

          });


  /* =========================================
     PREVIOUS
  ========================================= */

  document.getElementById("previousBtn")
          .addEventListener("click", function () {

            saveCurrentAnswer();

            if (currentQuestion > 0) {
              currentQuestion--;
              loadQuestion();
            }

          });


  /* =========================================
     REVIEW
  ========================================= */

  document.getElementById("reviewBtn")
          .addEventListener("click", function () {

            if (totalQuestions === 0) {
              return;
            }

            const question = questionData[currentQuestion];

            if (reviewQuestions.has(question.id)) {
              reviewQuestions.delete(question.id);
            } else {
              reviewQuestions.add(question.id);
            }

            updatePalette();
            updateReviewButton();

          });


  /* =========================================
     UPDATE BUTTONS
  ========================================= */

  function updateButtons() {

    document.getElementById("previousBtn")
            .disabled = currentQuestion === 0;

    if (currentQuestion === totalQuestions - 1) {

      document.getElementById("nextBtn").innerHTML =
              'Finish <i class="bi bi-check-lg ms-1"></i>';

    } else {

      document.getElementById("nextBtn").innerHTML =
              'Next <i class="bi bi-arrow-right ms-1"></i>';

    }

  }


  /* =========================================
     UPDATE PROGRESS
  ========================================= */

  function updateProgress() {

    if (totalQuestions === 0) {
      return;
    }

    const percentage =
            Math.round(
                    ((currentQuestion + 1) / totalQuestions) * 100
            );

    document.getElementById("progressBar")
            .style.width = percentage + "%";

    document.getElementById("progressPercent")
            .textContent = percentage + "%";

    const answeredCount =
            Object.keys(answers).length;

    document.getElementById("progressQuestionText")
            .textContent =
            "Question " +
            (currentQuestion + 1) +
            " of " +
            totalQuestions +
            " • " +
            answeredCount +
            " answered";

  }


  /* =========================================
     UPDATE PALETTE
  ========================================= */

  function updatePalette() {

    document.querySelectorAll(".palette-btn")
            .forEach(function (button) {

              const index =
                      parseInt(button.dataset.question);

              const question =
                      questionData[index];

              button.classList.remove(
                      "current",
                      "answered",
                      "review"
              );

              if (index === currentQuestion) {
                button.classList.add("current");
              }

              if (question && answers[question.id]) {
                button.classList.add("answered");
              }

              if (question && reviewQuestions.has(question.id)) {
                button.classList.add("review");
              }

            });

  }


  /* =========================================
     REVIEW BUTTON STATE
  ========================================= */

  function updateReviewButton() {

    if (totalQuestions === 0) {
      return;
    }

    const question = questionData[currentQuestion];

    const button =
            document.getElementById("reviewBtn");

    if (reviewQuestions.has(question.id)) {

      button.innerHTML =
              '<i class="bi bi-flag-fill me-1"></i> Remove Review';

    } else {

      button.innerHTML =
              '<i class="bi bi-flag me-1"></i> Mark for Review';

    }

  }


  /* =========================================
     TIMER
  ========================================= */

  let timeRemaining =
          Number(/*[[${exam.durationMinutes}]]*/ 30) * 60;

  const timerElement =
          document.getElementById("timer");

  const timerContainer =
          document.getElementById("timerContainer");

  function updateTimer() {

    const minutes =
            Math.floor(timeRemaining / 60);

    const seconds =
            timeRemaining % 60;

    timerElement.textContent =
            String(minutes).padStart(2, "0")
            + ":"
            + String(seconds).padStart(2, "0");

    if (timeRemaining <= 300) {
      timerContainer.classList.add("warning");
    }

    if (timeRemaining <= 60) {

      timerContainer.classList.remove("warning");
      timerContainer.classList.add("danger");

    }

    if (timeRemaining <= 0) {

      clearInterval(timerInterval);

      alert(
              "Time is over. Your exam will be submitted."
      );

      submitExam();

      return;

    }

    timeRemaining--;

  }

  const timerInterval =
          setInterval(updateTimer, 1000);


  /* =========================================
     SUBMIT EXAM
  ========================================= */

  document.getElementById("submitBtn")
          .addEventListener("click", function () {

            saveCurrentAnswer();

            const answeredCount =
                    Object.keys(answers).length;

            const confirmSubmit =
                    confirm(
                            "You have answered " +
                            answeredCount +
                            " out of " +
                            totalQuestions +
                            " questions.\n\n" +
                            "Are you sure you want to submit the exam?"
                    );

            if (confirmSubmit) {
              submitExam();
            }

          });


  /* =========================================
    SUBMIT EXAM
 ========================================= */

  let isSubmitting = false;

  async function submitExam() {

    // Prevent duplicate submissions.
    if (isSubmitting) {
      return;
    }

    isSubmitting = true;

    const submitButton = document.getElementById("submitBtn");
    const nextButton = document.getElementById("nextBtn");

    clearInterval(timerInterval);

    submitButton.disabled = true;
    nextButton.disabled = true;

    submitButton.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2"></span>' +
            'Submitting...';

    const attemptId = /*[[${attempt.id}]]*/ 0;

    try {

      // Spring Security CSRF token (provided by Thymeleaf on the page)
      const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

      const requestHeaders = {
        "Content-Type": "application/json"
      };

      if (csrfToken && csrfHeader) {
        requestHeaders[csrfHeader] = csrfToken;
      }

      const response = await fetch("/student/submit-exam", {
        method: "POST",
        headers: requestHeaders,
        body: JSON.stringify({
          attemptId: attemptId,
          answers: answers
        })
      });

      const responseText = await response.text();

      let result = null;

      try {
        result = JSON.parse(responseText);
      } catch (parseError) {
        console.error(
                "Unable to parse submission response:",
                responseText
        );
      }

      // Redirect only when the server confirms success.
      if (response.ok && result && result.success === true) {

        window.location.replace(
                "/student/result?attemptId=" +
                encodeURIComponent(attemptId)
        );

        return;
      }

      // Log the actual server response for debugging.
      console.error("Exam submission failed:", {
        status: response.status,
        response: responseText
      });

      alert(
              "Exam submission failed.\n\n" +
              "HTTP Status: " + response.status + "\n" +
              "Server Response: " + responseText
      );

    } catch (error) {

      console.error(
              "Exam submission request failed:",
              error
      );

      alert(
              "Unable to contact the server while submitting your exam. " +
              "Please check your internet connection and try again."
      );

    } finally {

      isSubmitting = false;

      submitButton.disabled = false;
      nextButton.disabled = false;

      submitButton.innerHTML =
              '<i class="bi bi-send-fill me-1"></i> Submit Exam';
    }
  }


  /* =========================================
     INITIAL LOAD
  ========================================= */

  loadQuestion();
  updateTimer();

</script>


</body>

</html>
