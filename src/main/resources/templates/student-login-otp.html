<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Verification | Sevakram Online Examination System</title>
    <style>
        :root {
            --primary: #3157d5;
            --primary-dark: #2444b5;
            --background: #f3f6fc;
            --text: #172033;
            --muted: #667085;
            --border: #d9e0ee;
            --danger: #b42318;
            --success: #067647;
            --card: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #eef2ff 0%, var(--background) 55%, #e8f7ff 100%);
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 34px;
            background: var(--card);
            border: 1px solid rgba(217, 224, 238, 0.9);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(31, 51, 97, 0.12);
        }

        .brand-mark {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 16px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #6d83ee);
            font-size: 23px;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 25px;
            letter-spacing: -0.4px;
        }

        .subtitle {
            margin: 12px 0 24px;
            color: var(--muted);
            text-align: center;
            line-height: 1.55;
            font-size: 14px;
        }

        .email {
            display: block;
            margin-top: 5px;
            color: var(--text);
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .alert {
            padding: 12px 14px;
            margin: 0 0 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.45;
        }

        .alert-error {
            color: var(--danger);
            background: #fef3f2;
            border: 1px solid #fecdca;
        }

        .alert-success {
            color: var(--success);
            background: #ecfdf3;
            border: 1px solid #abefc6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .otp-input {
            width: 100%;
            padding: 15px 12px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: #fff;
            color: var(--text);
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 10px;
            transition: border-color .2s, box-shadow .2s;
        }

        .otp-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(49, 87, 213, .12);
        }

        .hint {
            margin: 9px 0 20px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
        }

        .verify-btn {
            color: #fff;
            background: var(--primary);
            transition: background .2s, transform .2s;
        }

        .verify-btn:hover { background: var(--primary-dark); }
        .verify-btn:active { transform: translateY(1px); }

        .resend-form { margin-top: 12px; }

        .resend-btn {
            color: var(--primary);
            background: #eef2ff;
            border: 1px solid #dbe3ff;
        }

        .resend-btn:hover { background: #e3e9ff; }

        .footer {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #edf0f6;
            text-align: center;
            font-size: 13px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .card { padding: 26px 20px; border-radius: 16px; }
            h1 { font-size: 22px; }
            .otp-input { font-size: 23px; letter-spacing: 8px; }
        }
    </style>
</head>
<body>
<main class="card">
    <div class="brand-mark" aria-hidden="true">SE</div>

    <h1>Verify Student Login</h1>
    <p class="subtitle">
        We sent a one-time password to your email address.
        Enter the 6-digit OTP to continue.
        <span class="email" th:if="${email != null}" th:text="${email}">student@example.com</span>
    </p>

    <div class="alert alert-error" role="alert" th:if="${error != null}" th:text="${error}"></div>
    <div class="alert alert-success" role="status" th:if="${success != null}" th:text="${success}"></div>

    <form th:action="@{/student-login/verify-otp}" method="post">
        <label for="otp">6-digit OTP</label>
        <input
                id="otp"
                class="otp-input"
                type="text"
                name="otp"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                minlength="6"
                maxlength="6"
                placeholder="••••••"
                aria-describedby="otp-hint"
                required
        >
        <p class="hint" id="otp-hint">The OTP expires after 5 minutes. Do not share it with anyone.</p>
        <button class="verify-btn" type="submit">Verify &amp; Continue</button>
    </form>

    <form class="resend-form" th:action="@{/student-login/resend-otp}" method="post">
        <button class="resend-btn" type="submit">Resend OTP</button>
    </form>

    <div class="footer">
        <a th:href="@{/login(role='student')}">Back to Student Login</a>
    </div>
</main>
</body>
</html>
